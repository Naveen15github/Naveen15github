<svg width="600" height="520" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="520" rx="10" fill="#0d1117"/>
  <rect width="600" height="30" rx="10" fill="#161b22"/>
  <rect y="15" width="600" height="15" fill="#161b22"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
